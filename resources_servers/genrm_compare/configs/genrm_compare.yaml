# ============================================================================
# GenRM Compare Environment Configuration
# ============================================================================
# The GenRM model judge is NOT managed by NeMo-Gym. The YAML MUST supply:
#   - genrm_server_url : host:port of an already-running GenRM model endpoint
#                        (e.g. 0.0.0.0:8000). No default is provided.
#   - genrm_model      : GenRM model name served at genrm_server_url (validated
#                        against /v1/models at startup and sent as `model` in
#                        the judge payload).
#
# The GenRM model is queried via {genrm_server_url}/v1/chat/completions
# (native vLLM), NOT the Responses API. All pairwise comparison / aggregation /
# parse / cohort-buffering / data-schema logic is inherited from
# `genrm_compare_original`.
#
# This server compares multiple candidate responses using a GenRM model.
# The GenRM model uses a special chat template with roles 'response_1' and 'response_2'.
#
# Expected GenRM output format (JSON):
# {
#     "score_1": <1-5>,  # Individual helpfulness score for response 1
#     "score_2": <1-5>,  # Individual helpfulness score for response 2
#     "ranking": <1-6>   # 1=R1 much better, 6=R2 much better
# }
# ============================================================================

genrm_compare_resources_server:
  resources_servers:
    genrm_compare:
      entrypoint: app.py

      # MANDATED: externally-hosted GenRM model endpoint (no default).
      genrm_server_url: ""
      # MANDATED: GenRM model name served at genrm_server_url (no default).
      genrm_model: ""

      # Cohort-based verify (Difference 1): number of rollouts per prompt before running comparison.
      # When > 1, verify() buffers by task/prompt identity and returns relative rewards when a cohort is full.
      # Ensure rollout data has this many rows per prompt (e.g. num_repeats in rollout collection).
      num_rollouts_per_prompt: 16

      # Generation params for GenRM calls
      genrm_responses_create_params:
        input: []
        max_output_tokens: 65536
        temperature: 0.6
        top_p: 0.95

      # Max simultaneous in-flight GenRM HTTP requests from this server process.
      # Further callers queue without bound; connection errors are retried indefinitely.
      # 0 or negative = unlimited. Tune to what the judge endpoint can sustain.
      genrm_endpoint_max_concurrency: 512

      # Comparison strategy: "all_pairs" (C(n,2) comparisons) or "circular" (n comparisons)
      comparison_strategy: circular

      # Number of judge passes per pair (for majority voting)
      num_judges_per_comparison: 1

      # Principle-based comparison
      use_principle: false
      # default_principle: "..." (see code for full default text)

      # Aggregator method (only "simple_tiebreaker" is currently supported)
      aggregator_method: simple_tiebreaker

      # Bonus for shortest reasoning trace if in top percentile
      reasoning_bonus: 0.0
      # Bonus for shortest final answer if in top percentile
      answer_bonus: 0.0
      # Top percentile threshold (e.g., 0.2 = top 20%)
      top_percentile: 0.2
      # Group-relative length penalty coefficients
      # Shorter responses get bonus, longer get penalty (mean-centered)
      group_reasoning_length_penalty_coeff: 0.0
      group_answer_length_penalty_coeff: 0.0

      # Default scores when parsing fails
      default_score: 3.0
      default_ranking: 3.5

      # Debug logging
      debug_logging: false

      # Parse retry configuration
      genrm_parse_retries: 3
      genrm_parse_retry_sleep_s: 0.2

      # Server metadata
      domain: rlhf
      verified: false
      description: GenRM pairwise comparison for RLHF training
      value: Compare multiple candidate responses using GenRM model

genrm_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: genrm_compare_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/genrm_compare/data/example.jsonl

genrm_simple_agent_reasoning_off:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: genrm_compare_resources_server
      model_server:
        type: responses_api_models
        name: policy_model_reasoning_off
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/genrm_compare/data/example.jsonl
